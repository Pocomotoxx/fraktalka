[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraktalka"
version = "0.0.1"
description = "Validation-free structural diagnostics for representations (eval-first Layer 0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
benchmark = ["scikit-learn>=1.0"]  # only for the standard-benchmark dataset (digits)

[tool.setuptools.packages.find]
where = ["src"]
